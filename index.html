<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pulsefile · URL health snapshot</title>
    <meta name="description" content="One-shot URL health inspection - HTTP, SSL, redirects, security headers, content match, timing." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400;1,6..72,500&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/client/main.tsx"></script>
    <script
      src="http://localhost:8080/widget/loader.js"
      data-api-base="http://localhost:8080"
      data-product="pulsefile"
      data-suggestions='[
        {"label":"Monitor says up but content is broken","query":"My monitor reports up but the page is actually showing a maintenance message - why does Pulsefile think it&#39;s up?"},
        {"label":"Slack alerts not coming through","query":"Slack alerts stopped arriving for one of my monitors. Nothing changed on our side. What should I check?"},
        {"label":"Response time chart shows wrong times","query":"The response time chart timestamps look shifted by an hour after I changed my workspace timezone. Is the chart timezone wrong?"}
      ]'
    ></script>
  </body>
</html>
